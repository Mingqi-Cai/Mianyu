<title>影盏 Demo · 落地接触与体积光示意</title>
<desc>仅为制作准备示意，不是已做好的模型，不是已绑骨预览，不可当作已可上线资产。尚未建模、尚未绑骨、尚未真机验证。日期：2026-11-12（Asia/Shanghai）</desc>
