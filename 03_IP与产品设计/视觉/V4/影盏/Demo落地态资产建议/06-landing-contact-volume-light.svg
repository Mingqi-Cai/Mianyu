<rect class="bg" width="2400" height="1680"/>
<text x="1200" y="60" class="title" text-anchor="middle">影盏 Demo · 落地接触与体积光示意</text>
<text x="1200" y="100" class="sub0" text-anchor="middle">仅为制作准备示意，不是已做好可上线模型，不是已绑骨预览，不可当作已可上线资产。</text>
<text x="1200" y="126" class="sub" text-anchor="middle">尚未建模 · 尚未绑骨 · 尚未真机验证。默认坐下；禁止只悬浮；禁止白纸扁剪影。日期：2026-11-12（Asia/Shanghai）</text>
<text x="1200" y="148" class="sub" text-anchor="middle">形态对齐 V3 基准《04-影盏贴墙呼吸光轨》：圆浑暖琥珀纸灯、木质台面、微靠墙、方形月松插片、软阴影、闭目。不替代 V3 原图，不替代行为正本。</text>
<rect x="64" y="164" width="2272" height="40" rx="8" class="banner"/>
<text x="1200" y="190" class="banner-t" text-anchor="middle">示意 ≠ 已实现资产　　关掉所有光效之后，身体仍须坐在桌面或地面上；若关掉光就「没了」或还在半空，即为只做了悬浮</text>
<rect x="56" y="220" width="1480" height="1040" rx="16" class="card"/>
<text x="84" y="256" class="h" text-anchor="start">默认稳态：坐下（可微靠墙）· 重心在坐不在漂</text>
<line x1="80" y1="278" x2="1512" y2="278" stroke="#C4A882" stroke-width="2"/>
<rect x="1136" y="300" width="372" height="730" fill="#E2CEB0" stroke="#B8A084" stroke-width="2"/>
<text x="1322.0" y="324" class="s" text-anchor="middle">立面（墙）· 可有可无</text>
<rect x="136" y="1030" width="1372" height="28" fill="#A67A4E" stroke="#785636" stroke-width="2"/>
<polygon points="136,1058 1508,1058 1508,1116 120,1116" fill="#8A623E" stroke="#6E4E30"/>
