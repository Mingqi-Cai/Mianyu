<circle cx="100" cy="592" r="13" fill="#462A1C"/><text x="100" y="597" class="b" fill="#FCF7EE" text-anchor="middle">1</text>
<text x="120" y="586" class="b ink" text-anchor="start">固位：发际双点暗金扣环</text>
<text x="120" y="606" class="s" text-anchor="start">藏进鬃毛；跟颅骨，不随表情</text>
<line x1="116" y1="592" x2="673.4" y2="592" stroke="#462A1C" stroke-width="1"/>
<circle cx="100" cy="662" r="13" fill="#8C2E36"/><text x="100" y="667" class="b" fill="#FCF7EE" text-anchor="middle">2</text>
<text x="120" y="656" class="b red" text-anchor="start">悬绳：极短暗红浅 V</text>
<text x="120" y="676" class="s" text-anchor="start">唯一动作层「极慢晃动一拍」</text>
<circle cx="100" cy="740" r="13" fill="#7A5620"/><text x="100" y="745" class="b" fill="#FCF7EE" text-anchor="middle">3</text>
<text x="120" y="734" class="b gold" text-anchor="start">守结：暗金盘长结，轻悬中上额</text>
<text x="120" y="754" class="s" text-anchor="start">互动触点与发光体；随绳微摆</text>
<circle cx="1134" cy="572" r="13" fill="#7A5620"/><text x="1134" y="577" class="b" fill="#FCF7EE" text-anchor="middle">4</text>
<text x="1116" y="566" class="b gold" text-anchor="end">侧豆：并入绳层</text>
<text x="1116" y="584" class="s" text-anchor="end">随绳微动，下沿不过眉尖</text>
<text x="791.4" y="600" class="b red" text-anchor="start">摆动包络</text>
<text x="791.4" y="618" class="s" text-anchor="start">（建议起算，须真机验证）</text>
<text x="791.4" y="634" class="s" text-anchor="start">任何一帧不得越安全线</text>
<text x="601.4" y="687.0" class="b green" text-anchor="end">眉上额绒空带</text>
<text x="601.4" y="705.0" class="s" text-anchor="end">不得贴眉</text>
<text x="821.4" y="719" class="b green" text-anchor="start">眉上安全线</text>
<text x="851.4" y="747.0" class="b green" text-anchor="start">面部清空区</text>
<text x="851.4" y="767.0" class="s" text-anchor="start">眉、眼、鼻、嘴必须完全外露</text>
<text x="621.0" y="1176" class="s" text-anchor="middle">二维缩小后仍须读成「短 V 绳 + 中央暗金守结」  ·  图中光晕仅为分档示意，不是已做好的材质</text>
