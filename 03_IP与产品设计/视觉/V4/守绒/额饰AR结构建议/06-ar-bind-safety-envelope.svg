<circle cx="1254" cy="542" r="13" fill="#462A1C"/><text x="1254" y="547" class="b" fill="#FCF7EE" text-anchor="middle">1</text>
<text x="1272" y="536" class="b ink" text-anchor="start">固位藏于鬃毛发际</text>
<text x="1272" y="554" class="s" text-anchor="start">水平固位，不是宽额带</text>
<line x1="1270" y1="542" x2="1600" y2="542" stroke="#462A1C"/>
<circle cx="1254" cy="596" r="13" fill="#7A5620"/><text x="1254" y="601" class="b" fill="#FCF7EE" text-anchor="middle">3</text>
<text x="1272" y="590" class="b gold" text-anchor="start">守结停在眉骨以上</text>
<text x="1272" y="608" class="s" text-anchor="start">中上额前方轻悬</text>
<text x="1724" y="538" class="s" text-anchor="start">前后摆动包络</text>
<text x="1724" y="554" class="s" text-anchor="start">不得贴脸或嵌入额绒</text>
<text x="1762" y="609" class="b green" text-anchor="start">眉上安全线</text>
<text x="1770" y="674" class="b green" text-anchor="start">约 2–4 mm 悬空间隙</text>
<text x="1770" y="694" class="s" text-anchor="start">设计值，网格须预留，尚未建模</text>
<text x="1770" y="712" class="s" text-anchor="start">不贴死、不压脸</text>
<rect x="1262" y="900" width="1050" height="248" rx="10" class="card"/>
<text x="1278" y="928" class="b ink" text-anchor="start">建议父子关系（尚未建骨，名称可调）</text>
<text x="1278" y="956" class="t" text-anchor="start">角色身体 → 头部 / 颅骨刚性骨</text>
<text x="1278" y="980" class="t" text-anchor="start">　└ ① SR_Acc_Anchor_L / R　　无独立动画</text>
<text x="1278" y="1004" class="t" text-anchor="start">　　└ ② SR_Acc_CordRoot　　唯一摆动层，保持浅 V</text>
<text x="1278" y="1028" class="t" text-anchor="start">　　　　├ 悬绳 L / R → ④ 侧豆（随绳微动）</text>
<text x="1278" y="1052" class="t" text-anchor="start">　　　　└ ③ SR_Acc_Knot　触点与发光；不可独自大幅位移</text>
<text x="1278" y="1116" class="s" text-anchor="start">表情隔离：固位不跟眉、眼、口、鼻、下颌骨或面部形变。</text>
<text x="1278" y="1134" class="s" text-anchor="start">身体带动头部，配件只允许绳层那一拍。禁止自由摆锤。</text>
<rect x="56" y="1220" width="2288" height="424" rx="14" class="card"/>
<text x="84" y="1248" class="h2" text-anchor="start">制作准备要点（全部尚未实施，须真机验证后才能视为可行）</text>
<text x="84" y="1276" class="note" text-anchor="start">摆动：建议先按左右 ±2°–4°、前后 ±3°–6° 起算，只能收紧，不得放宽到越线。默认静息几乎静止；闲聊不摆绳；确认可叠一拍；低头 / 前倾过程中锁幅。</text>
<text x="84" y="1304" class="note" text-anchor="start">发光分档对齐正本：静息微光看 01 右侧与 02，完整发光看 04；确认一闪、晚安收光。光是局部暖金，不铺满脸，不把金属冲成贴纸。</text>
<text x="84" y="1332" class="note" text-anchor="start">已知可保留（不得当缺陷改设计）：眉上空带略窄于 V3；03 空隙含蓄、微光弱于 02，须结合 04 与 08 阅读；固位藏进鬃毛，需靠 04 与 08 读全三件式。若再收只可略提固位或再缩绳，不得把结做大或下移。</text>
<text x="84" y="1360" class="note" text-anchor="start">本图为结构示意，不可导入引擎，不作为已完成三维、已绑骨或已可上线的证据。矢量源与 PNG 预览同属示意，不以本图替代正本视觉稿。</text>
</svg>
