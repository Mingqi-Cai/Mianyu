<text x="1200" y="190" class="banner-t" text-anchor="middle">示意 ≠ 已实现资产　　三件式：发际双点固位 + 极短暗红浅 V 悬绳 + 中上额暗金盘长守结 + 左右极小暗金豆（侧豆并入绳层）</text>
