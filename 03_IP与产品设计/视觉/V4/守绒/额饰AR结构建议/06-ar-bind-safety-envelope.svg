<text x="1200" y="100" class="sub0" text-anchor="middle">仅为制作准备示意，不是已做好的模型，不是已绑骨预览，不可当作已可上线资产。</text>
<text x="1200" y="126" class="sub" text-anchor="middle">尚未建模 · 尚未绑骨 · 尚未真机验证。形态按配饰正本三件式。用词为「发际」。日期：2026-11-12（Asia/Shanghai）</text>
<text x="1200" y="148" class="sub" text-anchor="middle">不替代角色视觉稿 02 / 03 / 04，也不替代配饰结构图 08。本图只补充绑定层级与安全包络。</text>
